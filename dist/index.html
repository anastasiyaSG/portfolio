        <h1>QA Engineer / SDET</h1>
        <p>I combine an engineering background in safety-critical, process-driven fields with modern AI-augmented QA practices, using AI tooling with human oversight across the full test lifecycle.</p>
        <section aria-labelledby="noscript-ai-workflow">
          <h2 id="noscript-ai-workflow">AI-Augmented QA Workflow</h2>
          <p>I integrated AI tooling (Claude Code) into the full QA lifecycle. AI accelerates the work; I stay accountable for quality decisions.</p>
          <ol>
            <li><h3>Requirements refinement</h3><p>AI helps surface gaps, ambiguities, edge cases, and risks. I validate everything against business rules, and document verified business logic in Confluence.</p></li>
            <li><h3>Test case design</h3><p>AI-assisted generation of structured positive, negative, boundary, and risk-based test cases, reviewed and corrected by me.</p></li>
            <li><h3>Documentation</h3><p>I document the test process, business logic, and all test artifacts in Confluence, traceable to requirements.</p></li>
            <li><h3>Automation</h3><p>I expand automated test coverage with AI-assisted code generation, then review, refactor, and stabilize code for flakiness and maintainability.</p></li>
            <li><h3>Test data</h3><p>I generate synthetic test data for manual and automated testing. I never use real or personal data.</p></li>
            <li><h3>Continuous improvement</h3><p>Defects, false positives, and AI mistakes feed back into prompts, templates, and the process.</p></li>
          </ol>
          <h3>Guardrails and responsible use</h3>
          <ul>
            <li>Human-in-the-loop review of every AI output.</li>
            <li>Synthetic data only; no confidential, client, or personal data in prompts.</li>
            <li>Company-approved tools only; GDPR awareness.</li>
            <li>Verification against requirements and documented business rules to catch hallucinations and incorrect assumptions.</li>
            <li>AI is an accelerator, not a source of truth.</li>
          </ul>
          <h3>Lessons learned</h3>
          <p>AI helps most with edge-case discovery, boilerplate automation, and synthetic test data. Business-rule interpretation, assertions, and flaky logic need close supervision.</p>
          <h3>Day-to-day</h3>
          <ul>
            <li>Refining requirements and checking business logic against Confluence</li>
            <li>Designing and maintaining test cases with AI assistance and manual review</li>
            <li>Extending automated UI/API tests and keeping the suite stable</li>
            <li>Preparing synthetic test data for manual testing</li>
            <li>Documenting the test process and artifacts</li>
            <li>Identifying risks early in the sprint and maintaining quality gates in CI/CD</li>
          </ul>
          <p>Tools: Claude Code, Confluence, Python, Playwright, pytest, Selenium, API testing, k6, JMeter, GitHub Actions / CI/CD, synthetic test data.</p>
        </section>
