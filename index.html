        <h1>QA Engineer / SDET</h1>
        <p>I combine an engineering background in safety-critical, process-driven fields with modern AI-augmented QA practices, using AI tooling with human oversight across the full test lifecycle.</p>
        <section aria-labelledby="noscript-experience">
          <h2 id="noscript-experience">Experience</h2>
          <h3>Senior QA Engineer (Automation &amp; Quality Strategy) — TBI Bank</h3>
          <ul>
            <li>Integrated Claude Code across QA—from requirements and edge-case analysis to risk-based test design, traceable documentation, reviewed automation, and synthetic test data—verifying every output against business rules, protecting confidential data, and feeding lessons back into the process.</li>
          </ul>
        </section>
        <section aria-labelledby="noscript-ai-workflow">
          <h2 id="noscript-ai-workflow">AI-Augmented QA Workflow</h2>
          <p>I integrated AI tooling (Claude Code) into the full QA lifecycle. AI accelerates the work; I stay accountable for quality decisions.</p>
          <ol>
            <li><h3>Requirements refinement</h3><p>AI helps surface gaps, ambiguities, edge cases, and risks. I validate findings against business rules and document verified logic in Confluence.</p></li>
            <li><h3>Test case design</h3><p>I use AI to draft positive, negative, boundary, and risk-based test cases, then review and correct them.</p></li>
            <li><h3>Documentation</h3><p>I document test processes, business logic, and artifacts in Confluence, traceable to requirements.</p></li>
            <li><h3>Automation</h3><p>I expand automated coverage with AI-assisted code generation, then review, refactor, and stabilize it.</p></li>
            <li><h3>Test data</h3><p>I generate synthetic data for manual and automated testing; I never use real or personal data.</p></li>
            <li><h3>Continuous improvement</h3><p>Defects, false positives, and AI mistakes inform prompts, templates, and process improvements.</p></li>
          </ol>
          <h3>Guardrails and responsible use</h3>
          <p>I review every AI output, use synthetic data and company-approved tools, keep confidential and personal data out of prompts, and verify outputs against requirements. AI is an accelerator, not a source of truth.</p>
          <h3>Lessons learned</h3>
          <p>AI helps with edge-case discovery, boilerplate automation, and synthetic data. Business-rule interpretation, assertions, and flaky logic need close supervision.</p>
          <h3>Day-to-day</h3>
          <ul><li>Refining requirements and checking Confluence</li><li>Designing and maintaining reviewed test cases</li><li>Extending stable UI/API automation</li><li>Preparing synthetic data and documenting artifacts</li><li>Identifying sprint risks and maintaining CI/CD quality gates</li></ul>
          <p>Tools: Claude Code, Confluence, Python, Playwright, pytest, Selenium, API testing, k6, JMeter, GitHub Actions / CI/CD, synthetic test data.</p>
        </section>
